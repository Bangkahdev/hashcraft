name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid piling up redundant runs when a branch/PR gets pushed to again
# while a previous run is still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRD section 1: "Platform: Linux, Windows, macOS". Testing
        # across all three matters in particular for PRD section 4's
        # canonical-generation contract (identical output across
        # platforms) and section 5's atomic file-write behavior.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # PRD section 10: "CI runs Ruff, mypy, and pytest on Python
        # 3.10, 3.11, 3.12, and 3.13."
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install hashcraft with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -v

  packaging:
    name: packaging validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributable
        run: |
          pip install build
          python -m build

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/hashcraft-clean-env
          /tmp/hashcraft-clean-env/bin/pip install dist/*.whl

      - name: Smoke-test the installed console script
        # PRD section 2: "The release is complete when `pip install .`
        # exposes `hashcraft`." This confirms the built wheel actually
        # installs the `hashcraft` entry point in a fresh environment
        # with no leftover state from the dev/editable install above.
        run: |
          /tmp/hashcraft-clean-env/bin/hashcraft version
          /tmp/hashcraft-clean-env/bin/hashcraft info
          /tmp/hashcraft-clean-env/bin/hashcraft generate --names smoke_test --max-words 1 --case lower --separators "" --stdout

      - name: Upload built distributable
        uses: actions/upload-artifact@v4
        with:
          name: hashcraft-dist
          path: dist/
